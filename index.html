<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LifeOS</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

<script defer src="script.js"></script>

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>LifeOS</h2>

        <ul>

            <li class="active">🏠 Dashboard</li>

            <li>✅ Tasks</li>

            <li>🎯 Goals</li>

            <li>💪 Workout</li>

            <li>🥗 Diet</li>

            <li>💧 Water</li>

            <li>📝 Notes</li>

            <li>⏰ Pomodoro</li>

            <li>📊 Analytics</li>

        </ul>

    </aside>

    <!-- Main -->

    <main class="main">

        <header>

            <h1 id="greeting"></h1>

            <div id="clock"></div>

        </header>

        <section class="task-section">

            <div class="task-top">

                <input
                    id="taskInput"
                    type="text"
                    placeholder="Enter a task..."
                >

                <button id="addTask">
                    Add Task
                </button>

            </div>

            <input
                id="searchTask"
                type="text"
                placeholder="Search task..."
            >

            <ul id="taskList"></ul>

        </section>

    </main>

</div>

</body>
</html>
